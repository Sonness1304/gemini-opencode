name: Bug report
description: Report a reproducible protocol, queue, patch, or setup problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic data. Do not attach cookies, keys, databases, or private chat exports.
  - type: textarea
    id: environment
    attributes:
      label: Environment and revisions
      description: OS, Node/Go/OpenCode versions, repository commit, and upstream pin.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Exact commands and a small synthetic input.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include error codes and whether this is a fixture or a live run.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Checks performed
      description: Test command, exit code, and relevant sanitized metadata.
